function statusOf(s){return s==='available'?'available':s==='booked'?'booked':'sold'} function money(u){if(u.status==='sold')return'Sold';if(u.status==='booked')return'Reserved';if(u.status==='request')return'Ask price';return u.discounted_price_raw?`${Number(u.discounted_price_raw).toLocaleString('en')} €`:u.price_raw?`${Number(u.price_raw).toLocaleString('en')} €`:'Ask price'}
function isBusiness(u){return !u.rooms_count||['Office','Service','Catering','Retail'].includes(Object.values(u.function||{})[0])}
function makeUnits(root){const grouped=new Map();root.traverse(o=>{if(!o.isMesh)return;const m=/^apartment_(\d+)/i.exec(o.name);if(!m){const n=o.name.toUpperCase();if(/^BILLBOARD_00[12]$/.test(n)){o.visible=false;return}if(/^BUILDING_(TOWERA|TOWERB|PODIUM)$/.test(n)){o.material=invisibleShell;o.visible=false}else{o.material=materials.get(keyFor(o.name))||fallback(o.name)}return}const no=String(+m[1]);if(!grouped.has(no))grouped.set(no,[]);grouped.get(no).push(o);o.renderOrder=3}); units=inventory.map(data=>{const no=String(+data.number_num),meshes=grouped.get(no)||[];const box=new THREE.Box3();meshes.forEach(m=>box.expandByObject(m));const center=box.isEmpty()?new THREE.Vector3():box.getCenter(new THREE.Vector3());const u={...data,meshes,box,center};meshes.forEach(m=>{m.userData.unit=u;m.material=palette.idle});return u}).filter(u=>u.meshes.length);console.info(`${units.length} inventory records mapped to model`)}
function fit(root){const box=new THREE.Box3().setFromObject(root),c=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()),r=size.length()/2;modelCenter.copy(c);controls.target.set(c.x,c.y-size.y*.08,c.z);const viewDirection=new THREE.Vector3(.72,1.48,1.48).normalize(),openingDistance=r*3.05;camera.position.copy(controls.target).addScaledVector(viewDirection,openingDistance);controls.minDistance=r*.46;controls.maxDistance=openingDistance;camera.near=r/150;camera.far=r*20;camera.updateProjectionMatrix();controls.update();controls.saveState()}
function matchesSearch(u){let q=$('#unitSearch').value.toLowerCase().trim();if(!q)return true;const floor=q.match(/floor\s*(\d+)(?:\s*-\s*(\d+))?/i);if(floor){const low=+floor[1],high=+(floor[2]||floor[1]),value=+u.min_floor;if(value<Math.min(low,high)||value>Math.max(low,high))return false;q=q.replace(floor[0],' ')}const tower=q.match(/tower\s*([ab])/i);if(tower){if(String(u.house?.identificator).toLowerCase()!==tower[1].toLowerCase())return false;q=q.replace(tower[0],' ')}const rooms=q.match(/(\d+)\s*rooms?/i);if(rooms){if(+u.rooms_count!==+rooms[1])return false;q=q.replace(rooms[0],' ')}const unit=q.match(/unit\s*(\d+)/i);if(unit){if(String(u.number_num)!==String(+unit[1])&&String(u.number)!==unit[1])return false;q=q.replace(unit[0],' ')}const remaining=q.replace(/[,;]+/g,' ').replace(/\s+/g,' ').trim();if(!remaining)return true;const number=`${u.number} ${u.number_num}`.toLowerCase();return /^\d+$/.test(remaining)?String(u.number_num)===String(+remaining)||String(u.number)===remaining:number.includes(remaining)}
function passes(u){const fl=+u.min_floor,area=+u.area_size_raw,price=+(u.discounted_price_raw||u.price_raw||0),amin=+$('#areaMin').value||0,amax=+$('#areaMax').value||Infinity,pmin=+$('#priceMin').value||0,pmax=+$('#priceMax').value||Infinity;return(state.tower==='all'||u.house?.identificator===state.tower)&&(state.rooms==='all'||+u.rooms_count===+state.rooms)&&(state.type==='all'||(state.type==='business')===isBusiness(u))&&(!state.available||u.status==='available')&&(state.view==='all'||(u.view||'').includes(state.view))&&fl>=(+$('#floorMin').value||1)&&fl<=(+$('#floorMax').value||12)&&area>=amin&&area<=amax&&(u.status==='request'||(price>=pmin&&price<=pmax))&&matchesSearch(u)}
function filtersActive(){return state.tower!=='all'||state.rooms!=='all'||state.type!=='all'||state.available||state.view!=='all'||$('#unitSearch').value.trim()||['floorMin','areaMin','priceMin'].some(id=>+$('#'+id).value>+$('#'+id).min)||['floorMax','areaMax','priceMax'].some(id=>+$('#'+id).value<+$('#'+id).max)}
function setupRange(rangeId,minId,maxId,min,max,step,format){const wrap=$(rangeId),low=$(minId),high=$(maxId),lowLabel=$(minId+'Label'),highLabel=$(maxId+'Label'),fill=wrap.querySelector('.range-fill');Object.assign(low,{min,max,step,value:min});Object.assign(high,{min,max,step,value:max});function update(changed){if(+low.value>+high.value){if(changed===low)low.value=high.value;else high.value=low.value}const span=max-min||1,left=(+low.value-min)/span*100,right=(+high.value-min)/span*100;fill.style.left=left+'%';fill.style.width=(right-left)+'%';lowLabel.textContent=format(+low.value);highLabel.textContent=format(+high.value);low.style.zIndex=+low.value>=max-step?'5':'3';high.style.zIndex='4';renderList()}low.oninput=()=>update(low);high.oninput=()=>update(high);update()}
function setupFilterRanges(){const floors=inventory.map(u=>+u.min_floor).filter(Number.isFinite),areas=inventory.map(u=>+u.area_size_raw).filter(Number.isFinite),prices=inventory.map(u=>+(u.discounted_price_raw||u.price_raw)).filter(v=>Number.isFinite(v)&&v>0);const floorMin=floors.length?Math.min(...floors):1,floorMax=floors.length?Math.max(...floors):12,areaMin=areas.length?Math.floor(Math.min(...areas)):0,areaMax=areas.length?Math.ceil(Math.max(...areas)):1,priceMin=prices.length?Math.floor(Math.min(...prices)/10000)*10000:0,priceMax=prices.length?Math.ceil(Math.max(...prices)/10000)*10000:10000;setupRange('#floorRange','#floorMin','#floorMax',floorMin,floorMax,1,v=>String(v));setupRange('#areaRange','#areaMin','#areaMax',areaMin,areaMax,1,v=>`${v.toLocaleString('en')} m²`);setupRange('#priceRange','#priceMin','#priceMax',priceMin,priceMax,10000,v=>`${v.toLocaleString('en')} €`)}
function focusUnit(u){if(hoverDistance===null)hoverDistance=camera.position.distanceTo(controls.target);const distance=hoverDistance,side=new THREE.Vector3(u.center.x-modelCenter.x,0,u.center.z-modelCenter.z);if(side.lengthSq()<.001)side.set(camera.position.x-modelCenter.x,0,camera.position.z-modelCenter.z);side.normalize();targetGoal=u.center.clone();const eyeLift=Math.min(distance*.11,9),sideDistance=Math.sqrt(Math.max(0,distance*distance-eyeLift*eyeLift));cameraGoal=targetGoal.clone().add(new THREE.Vector3(side.x*sideDistance,eyeLift,side.z*sideDistance))}
function renderList(){shown=units.filter(passes);const available=shown.filter(u=>u.status==='available').length;$('#count').textContent=`${shown.length} of ${units.length} · ${available} available`;$('#units').innerHTML=shown.map(u=>`<button class="unit${u.status==='sold'?' sold-unit':''}${selected===u?' selected':''}" data-no="${u.number_num}"><span class="unit-no">${u.number}</span><span>${u.house?.identificator||'–'}</span><span>${u.floor||u.min_floor||'–'}</span><span>${u.rooms_count||'–'}</span><span>${u.area_size_raw||u.area_size||'–'}</span><span class="unit-price ${u.status==='sold'?'sold':''}">${money(u)}</span></button>`).join('');$('#units').querySelectorAll('.unit').forEach((el,i)=>{const u=shown[i];el.onmouseenter=()=>{hovered=u;focusUnit(u);paint()};el.onmouseleave=()=>{hovered=null;paint()};el.onclick=()=>selectUnit(u)});paint()}
function paint(){const visible=new Set(shown),filtering=filtersActive();units.forEach(u=>u.meshes.forEach(m=>{const on=visible.has(u);m.material=!on&&filtering?palette.filteredOut:!on?palette.idle:u===selected?palette.selected:u===hovered?palette.hover:palette[statusOf(u.status)];m.renderOrder=u===selected?12:u===hovered?11:!on&&filtering?9:3}));document.querySelectorAll('#units .unit').forEach(row=>{const no=row.dataset.no;row.classList.toggle('selected',no===String(selected?.number_num));row.classList.toggle('hovered',no===String(hovered?.number_num)&&no!==String(selected?.number_num))})}
function selectUnit(u){selected=selected===u?null:u;renderList();paint()}
function pick(e){const r=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(pointer,camera);const targets=shown.flatMap(u=>u.meshes),hit=ray.intersectObjects(targets,false)[0];return hit?.object.userData.unit||null}
renderer.domElement.onpointermove=e=>{const next=pick(e);renderer.domElement.style.cursor=next?'pointer':'grab';if(next===hovered)return;hovered=next;paint();if(hovered)document.querySelector(`#units .unit[data-no="${hovered.number_num}"]`)?.scrollIntoView({behavior:'smooth',block:'nearest'})};renderer.domElement.onpointerleave=()=>{hovered=null;paint()};renderer.domElement.onclick=e=>{const u=pick(e);if(u)selectUnit(u)};
function bindSegments(id,key){$(id).onclick=e=>{const b=e.target.closest('button');if(!b)return;$(id).querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));state[key]=b.dataset.v;renderList()}}bindSegments('#tower','tower');bindSegments('#type','type');bindSegments('#rooms','rooms');
$('#unitSearch').oninput=renderList;$('#availableOnly').onchange=e=>{state.available=e.target.checked;renderList()};$('#view').onchange=e=>{state.view=e.target.value;renderList()};$('#clear').onclick=()=>location.reload();
let activeFloor=1;$('#floorButtons').innerHTML=Array.from({length:12},(_,i)=>`<button data-floor="${i+1}" class="${i===0?'on':''}">${i+1}</button>`).join('');
function setView(mode){document.querySelectorAll('.view-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.view===mode));const alt=$('#altView'),model=mode==='model';alt.classList.toggle('show',!model);$('.hint').style.display=model?'block':'none';if(mode==='plans'){alt.classList.add('show');$('#planTools').style.display='flex';$('.compass').style.display='block';$('#planImage').src=`./plans/floor-${activeFloor}.svg`;$('#planImage').alt=`Floor ${activeFloor} plan`}}
$('.view-tabs').onclick=e=>{const b=e.target.closest('[data-view]');if(b)setView(b.dataset.view)};$('#floorButtons').onclick=e=>{const b=e.target.closest('[data-floor]');if(!b)return;activeFloor=+b.dataset.floor;$('#floorButtons').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));$('#planImage').src=`./plans/floor-${activeFloor}.svg`;$('#planImage').alt=`Floor ${activeFloor} plan`};$('#planTools').onclick=e=>{const b=e.target.closest('[data-tower]');if(!b)return;$('#planTools').querySelectorAll('[data-tower]').forEach(x=>x.classList.toggle('on',x===b));state.tower=b.dataset.tower;document.querySelectorAll('#tower button').forEach(x=>x.classList.toggle('on',x.dataset.v===state.tower));renderList()};
controls.addEventListener('start',()=>{cameraGoal=null;targetGoal=null;hoverDistance=null});
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();renderer.setAnimationLoop(()=>{if(cameraGoal&&targetGoal){const distance=hoverDistance||camera.position.distanceTo(controls.target),direction=camera.position.clone().sub(controls.target).normalize(),goalDirection=cameraGoal.clone().sub(targetGoal).normalize();direction.lerp(goalDirection,.085).normalize();controls.target.lerp(targetGoal,.085);camera.position.copy(controls.target).addScaledVector(direction,distance);if(direction.dot(goalDirection)>.99999&&controls.target.distanceToSquared(targetGoal)<.01){controls.target.copy(targetGoal);camera.position.copy(targetGoal).addScaledVector(goalDirection,distance);cameraGoal=null;targetGoal=null}}controls.update();renderer.render(scene,camera)});
try{inventory=await(await fetch('./apartments.json')).json();setupFilterRanges();await loadMaterials();const gltf=await gltfLoader.loadAsync('./volta-skai.glb');scene.add(gltf.scene);gltf.scene.updateWorldMatrix(true,true);makeUnits(gltf.scene);fit(gltf.scene);renderList();$('#loading').style.opacity=0;setTimeout(()=>$('#loading').remove(),450)}catch(e){console.error(e)}
</script></body></html>
