<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allocation explorer</title>
<style>
  :root{
    --bg:#141414; --panel:#1a1a1a; --panel-2:#232323; --line:#2c2c2c;
    --text:#ececec; --muted:#8a8a8a; --accent:#306738; --accent-lit:#4f9c5c;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--text);overflow:hidden;
    font:13px/1.45 ui-sans-serif,-apple-system,"Segoe UI",Inter,system-ui,sans-serif;
    display:grid;grid-template-columns:220px 1fr 288px;
  }
  .panel{background:var(--panel);display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
  .panel.right{border-right:none;border-left:1px solid var(--line)}
  .head{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
  .head h2{margin:0;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .head span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .body{flex:1;min-height:0;overflow-y:auto;padding:15px}
  .grp{margin-bottom:20px}
  .grp>label{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
  .seg{display:flex;gap:4px;flex-wrap:wrap}
  .seg button{
    flex:1 0 30px;padding:7px 4px;background:var(--panel-2);color:var(--text);border:1px solid var(--line);
    border-radius:6px;cursor:pointer;font:inherit;font-size:12px
  }
  .seg button:hover{background:#2c2c2c}
  .seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent)}
  input[type=range]{width:100%;accent-color:var(--accent);background:transparent}
  .val{display:block;margin-top:5px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .tg{display:flex;gap:9px;align-items:center;background:none;border:0;color:var(--text);font:inherit;cursor:pointer;padding:0}
  .box{width:15px;height:15px;border-radius:4px;border:1px solid var(--line);background:var(--panel-2);flex:none;position:relative}
  .tg[aria-pressed=true] .box{background:var(--accent);border-color:var(--accent)}
  .tg[aria-pressed=true] .box::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
  .clear{width:100%;padding:8px;background:none;border:1px solid var(--line);border-radius:6px;color:var(--muted);cursor:pointer;font:inherit;font-size:12px}
  .clear:hover{color:var(--text)}
  button:focus-visible,tr:focus-visible{outline:2px solid var(--accent-lit);outline-offset:2px}
  #stage{position:relative;min-width:0;cursor:grab}
  #stage.drag{cursor:grabbing}
  canvas{display:block;position:absolute;inset:0}
  #tip{
    position:absolute;pointer-events:none;background:rgba(16,16,16,.96);border:1px solid var(--line);
    border-left:2px solid var(--accent-lit);border-radius:6px;padding:8px 11px;white-space:nowrap;
    transform:translate(-50%,calc(-100% - 12px));opacity:0;transition:opacity .1s;box-shadow:0 8px 26px rgba(0,0,0,.55)
  }
  #tip b{display:block;font-size:15px;font-weight:500;margin-bottom:1px}
  #tip i{display:block;font-style:normal;color:var(--muted);font-size:11px}
  .hud{position:absolute;left:15px;bottom:14px;display:flex;gap:14px;color:var(--muted);font-size:11px;align-items:center;pointer-events:none}
  .sw{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:middle}
  table{width:100%;border-collapse:collapse}
  th{position:sticky;top:0;background:var(--panel);font-weight:400;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 7px 8px;text-align:right;border-bottom:1px solid var(--line)}
  th:first-child{text-align:left}
  td{padding:7px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px;border-bottom:1px solid #222}
  td:first-child{text-align:left;font-size:13px}
  tbody tr{cursor:pointer}
  tbody tr:hover td{background:#262626}
  tbody tr[data-on=true] td{background:rgba(48,103,56,.26)}
  tbody tr[data-s="0"] td{color:#666}
  .none{padding:26px 12px;text-align:center;color:var(--muted);font-size:12px}
  .body::-webkit-scrollbar{width:9px}
  .body::-webkit-scrollbar-thumb{background:#323232;border-radius:9px;border:2px solid var(--panel)}
</style>
</head>
<body>

<aside class="panel">
  <div class="head"><h2>Filters</h2></div>
  <div class="body">
    <div class="grp"><label>Tower</label><div class="seg" id="s-tower"></div></div>
    <div class="grp"><label>Rooms</label><div class="seg" id="s-rooms"></div></div>
    <div class="grp"><label>Floor</label><input type="range" id="r-floor"><span class="val" id="v-floor"></span></div>
    <div class="grp"><label>Minimum size</label><input type="range" id="r-area"><span class="val" id="v-area"></span></div>
    <div class="grp"><label>Maximum price</label><input type="range" id="r-price"><span class="val" id="v-price"></span></div>
    <div class="grp"><button class="tg" id="t-avail" aria-pressed="false"><span class="box"></span>Available only</button></div>
    <button class="clear" id="clear">Clear filters</button>
  </div>
</aside>

<main id="stage">
  <canvas id="c"></canvas>
  <div id="tip"></div>
  <div class="hud">
    <span><i class="sw" style="background:#4f9c5c"></i>Available</span>
    <span><i class="sw" style="background:#6e6e6e"></i>Sold</span>
    <span>Drag to orbit, scroll to zoom</span>
  </div>
</main>

<aside class="panel right">
  <div class="head"><h2>Units</h2><span id="count"></span></div>
  <div class="body" style="padding:10px 7px">
    <table><thead><tr><th>No.</th><th>Twr</th><th>Fl</th><th>Rm</th><th>m²</th><th>Price</th></tr></thead><tbody id="tb"></tbody></table>
    <div class="none" id="none" hidden>No units match these filters.</div>
  </div>
</aside>

const PODIUM = [-68.73, -0.8, -59.56, 2.05, 13.56, -16.19];
const GROUND = [-95.8, -79.5, 20.4, 25.4];   // xmin, zmin, xmax, zmax

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const stage = document.getElementById('stage'), tip = document.getElementById('tip');
const hit = document.createElement('canvas'), hctx = hit.getContext('2d', { willReadFrequently:true });

const CEN = [ (GROUND[0]+GROUND[2])/2, 14, (GROUND[1]+GROUND[3])/2 ];
const cam = { yaw:-0.72, pitch:0.52, zoom:1, ox:0, oy:0 };
let W=0, H=0, DPR=1, scale=1;

const money = n => '€' + n.toLocaleString('en-GB');

/* ---------- projection ---------- */
function project(x,y,z){
  const dx=x-CEN[0], dy=y-CEN[1], dz=z-CEN[2];
  const cy=Math.cos(cam.yaw), sy=Math.sin(cam.yaw);
  const rx =  dx*cy + dz*sy;
  const rz = -dx*sy + dz*cy;
  const cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch);
  const ry =  dy*cp - rz*sp;
  const depth = dy*sp + rz*cp;
  const s = scale*cam.zoom;
  return [ W/2 + rx*s + cam.ox, H/2 - ry*s + cam.oy, depth ];
}

const CORNERS=[[0,1,2],[3,1,2],[3,1,5],[0,1,5],[0,4,2],[3,4,2],[3,4,5],[0,4,5]];
const FACES=[[0,1,2,3],[4,7,6,5],[0,4,5,1],[1,5,6,2],[2,6,7,3],[3,7,4,0]];
const NORMALS=[[0,-1,0],[0,1,0],[0,0,-1],[1,0,0],[0,0,1],[-1,0,0]];
const LIGHT=[0.42,0.78,0.46];

function faces(b, shade){
  const pts = CORNERS.map(c => project(b[c[0]], b[c[1]], b[c[2]]));
  const out=[];
  for (let i=0;i<6;i++){
    const f=FACES[i], n=NORMALS[i];
    const a=pts[f[0]], c=pts[f[1]], d=pts[f[2]];
    // screen-space winding tells us which faces point away
    if ((c[0]-a[0])*(d[1]-a[1]) - (c[1]-a[1])*(d[0]-a[0]) <= 0) continue;
    const lit = 0.42 + 0.58*Math.max(0, n[0]*LIGHT[0]+n[1]*LIGHT[1]+n[2]*LIGHT[2]);
    out.push({ p:f.map(k=>pts[k]), z:(pts[f[0]][2]+pts[f[1]][2]+pts[f[2]][2]+pts[f[3]][2])/4, lit:shade?lit:1 });
  }
  return out;
}
const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const rgb=(c,l)=>`rgb(${Math.round(c[0]*l)},${Math.round(c[1]*l)},${Math.round(c[2]*l)})`;

const C_AVAIL=[79,156,92], C_SOLD=[110,110,110], C_OFF=[46,46,46], C_HOT=[126,214,144], C_PODIUM=[58,55,51];

/* ---------- draw ---------- */
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);

  // ground
  const g=[ project(GROUND[0],-0.8,GROUND[1]), project(GROUND[2],-0.8,GROUND[1]),
            project(GROUND[2],-0.8,GROUND[3]), project(GROUND[0],-0.8,GROUND[3]) ];
  ctx.beginPath(); ctx.moveTo(g[0][0],g[0][1]); g.slice(1).forEach(p=>ctx.lineTo(p[0],p[1])); ctx.closePath();
  ctx.fillStyle='#1b1b1b'; ctx.fill();

  const on = new Set(shown.map(u=>u.id));
  const quads=[];
  faces(PODIUM,true).forEach(f=>quads.push({...f, col:C_PODIUM, edge:'#242220'}));
  for (const u of UNITS){
    const active = on.has(u.id);
    const hot = (sel&&sel.id===u.id) || (hover&&hover.id===u.id);
    const col = !active ? C_OFF : hot ? C_HOT : (u.s ? C_AVAIL : C_SOLD);
    for (const f of faces(u.b,true)) quads.push({...f, col, edge: active?'rgba(0,0,0,.45)':'rgba(0,0,0,.25)', dim:!active});
  }
  quads.sort((a,b)=>a.z-b.z);
  for (const q of quads){
    ctx.beginPath(); ctx.moveTo(q.p[0][0],q.p[0][1]);
    for (let i=1;i<4;i++) ctx.lineTo(q.p[i][0],q.p[i][1]);
    ctx.closePath();
    ctx.globalAlpha = q.dim ? 0.55 : 1;
    ctx.fillStyle = rgb(q.col, q.lit); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.lineWidth = 0.6; ctx.strokeStyle = q.edge; ctx.stroke();
  }
  if (hitDirty) drawHit();
  positionTip();
}

function drawHit(){
  hctx.setTransform(DPR,0,0,DPR,0,0);
  hctx.clearRect(0,0,W,H);
  const quads=[];
  for (const u of shown) for (const f of faces(u.b,false)) quads.push({...f, id:u.id});
  quads.sort((a,b)=>a.z-b.z);
  for (const q of quads){
    hctx.beginPath(); hctx.moveTo(q.p[0][0],q.p[0][1]);
    for (let i=1;i<4;i++) hctx.lineTo(q.p[i][0],q.p[i][1]);
    hctx.closePath();
    // encode the unit id straight into the pixel colour, an id pass in miniature
    hctx.fillStyle = `rgb(${(q.id>>16)&255},${(q.id>>8)&255},${q.id&255})`;
    hctx.fill();
  }
  hitDirty=false;
}
function at(px,py){
  const d = hctx.getImageData(px*DPR, py*DPR, 1, 1).data;
  if (!d[3]) return null;
  const id=(d[0]<<16)|(d[1]<<8)|d[2];
  return shown.find(u=>u.id===id) || null;
}

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=stage.clientWidth; H=stage.clientHeight;
  [cv,hit].forEach(c=>{ c.width=W*DPR; c.height=H*DPR; c.style.width=W+'px'; c.style.height=H+'px'; });
  scale=Math.min(W,H)/135;
  hitDirty=true; draw();
}
addEventListener('resize',resize);

/* ---------- input ---------- */
let dragging=false, moved=false, last=null;
stage.addEventListener('pointerdown',e=>{ dragging=true; moved=false; last=[e.clientX,e.clientY]; stage.classList.add('drag'); stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointerup',e=>{
  dragging=false; stage.classList.remove('drag');
  if (!moved){ const u=pickFrom(e); if (u) select(u); }
});
stage.addEventListener('pointermove',e=>{
  if (dragging){
    const dx=e.clientX-last[0], dy=e.clientY-last[1];
    if (Math.abs(dx)+Math.abs(dy)>3) moved=true;
    last=[e.clientX,e.clientY];
    cam.yaw += dx*0.007;
    cam.pitch = Math.max(0.06, Math.min(1.35, cam.pitch + dy*0.006));
    hitDirty=true; draw();
    return;
  }
  const u=pickFrom(e);
  if (u!==hover){ hover=u; paintRows(); draw(); }
  if (u){ tip.style.opacity=1; tip.dataset.x=e.clientX; tip.dataset.y=e.clientY; }
  else if (!sel) tip.style.opacity=0;
});
stage.addEventListener('pointerleave',()=>{ if(hover){hover=null;paintRows();draw();} if(!sel) tip.style.opacity=0; });
stage.addEventListener('wheel',e=>{
  e.preventDefault();
  cam.zoom=Math.max(0.45,Math.min(4.5, cam.zoom*(e.deltaY>0?0.92:1.087)));
  hitDirty=true; draw();
},{passive:false});

function pickFrom(e){
  const r=cv.getBoundingClientRect();
  return at(e.clientX-r.left, e.clientY-r.top);
}
function positionTip(){
  const u = hover || sel; if (!u){ tip.style.opacity=0; return; }
  const c = project((u.b[0]+u.b[3])/2, u.b[4], (u.b[2]+u.b[5])/2);
  tip.style.left=c[0]+'px'; tip.style.top=c[1]+'px';
  tip.innerHTML = `<b>${u.id}</b><i>Tower ${u.t} · floor ${u.f} · ${u.r} rooms · ${u.a} m²</i><i>${u.s?money(u.p):'Sold'}</i>`;
  tip.style.opacity=1;
}

/* ---------- filters ---------- */
const st={tower:'all',rooms:'all',floor:99,area:0,price:1e9,avail:false};
const maxF=Math.max(...UNITS.map(u=>u.f)), maxA=Math.ceil(Math.max(...UNITS.map(u=>u.a))), maxP=Math.max(...UNITS.map(u=>u.p));

function seg(host,vals,key,label){
  host.innerHTML='';
  ['all',...vals].forEach(v=>{
    const b=document.createElement('button');
    b.textContent = v==='all' ? 'All' : (label?label(v):v);
    b.setAttribute('aria-pressed', String(st[key]===v));
    b.onclick=()=>{ st[key]=v; [...host.children].forEach(c=>c.setAttribute('aria-pressed',String(c===b))); apply(); };
    host.appendChild(b);
  });
}
function rng(id,out,min,max,val,step,fmt){
  const el=document.getElementById(id), o=document.getElementById(out);
  el.min=min; el.max=max; el.step=step; el.value=val;
  const s=()=>{ o.textContent=fmt(+el.value); apply(); };
  el.oninput=s; o.textContent=fmt(+el.value);
}
seg(document.getElementById('s-tower'),['A','B'],'tower');
seg(document.getElementById('s-rooms'),[...new Set(UNITS.map(u=>u.r))].sort((a,b)=>a-b),'rooms');
rng('r-floor','v-floor',1,maxF,maxF,1,v=>{st.floor=v;return `Floor 1 to ${v}`;});
rng('r-area','v-area',0,maxA,0,5,v=>{st.area=v;return `${v} m² and above`;});
rng('r-price','v-price',0,maxP,maxP,10000,v=>{st.price=v;return `Up to ${money(v)}`;});
document.getElementById('t-avail').onclick=function(){ st.avail=!st.avail; this.setAttribute('aria-pressed',String(st.avail)); apply(); };
document.getElementById('clear').onclick=()=>{
  Object.assign(st,{tower:'all',rooms:'all',floor:maxF,area:0,price:maxP,avail:false});
  sel=null; hover=null;
  seg(document.getElementById('s-tower'),['A','B'],'tower');
  seg(document.getElementById('s-rooms'),[...new Set(UNITS.map(u=>u.r))].sort((a,b)=>a-b),'rooms');
  rng('r-floor','v-floor',1,maxF,maxF,1,v=>{st.floor=v;return `Floor 1 to ${v}`;});
  rng('r-area','v-area',0,maxA,0,5,v=>{st.area=v;return `${v} m² and above`;});
  rng('r-price','v-price',0,maxP,maxP,10000,v=>{st.price=v;return `Up to ${money(v)}`;});
  document.getElementById('t-avail').setAttribute('aria-pressed','false');
  tip.style.opacity=0; apply();
};

const pass = u => (st.tower==='all'||u.t===st.tower) && (st.rooms==='all'||u.r===st.rooms)
  && u.f<=st.floor && u.a>=st.area && u.p<=st.price && (!st.avail || u.s===1);

function apply(){
  shown = UNITS.filter(pass);
  const tb=document.getElementById('tb');
  tb.innerHTML='';
  shown.forEach(u=>{
    const tr=document.createElement('tr');
    tr.tabIndex=0; tr.dataset.id=u.id; tr.dataset.s=u.s;
    tr.innerHTML=`<td>${u.id}</td><td>${u.t}</td><td>${u.f}</td><td>${u.r}</td><td>${u.a}</td><td>${u.s?money(u.p):'Sold'}</td>`;
    tr.onmouseenter=()=>{ hover=u; paintRows(); draw(); };
    tr.onmouseleave=()=>{ hover=null; paintRows(); draw(); };
    tr.onclick=()=>select(u);
    tr.onkeydown=e=>{ if(e.key==='Enter') select(u); };
    tb.appendChild(tr);
  });
  document.getElementById('none').hidden = shown.length>0;
  document.getElementById('count').textContent = `${shown.length} of ${UNITS.length} · ${shown.filter(u=>u.s).length} available`;
  if (sel && !shown.some(u=>u.id===sel.id)) sel=null;
  paintRows(); hitDirty=true; draw();
}
function paintRows(){
  document.querySelectorAll('#tb tr').forEach(tr=>{
    const id=+tr.dataset.id;
    tr.dataset.on = String((sel&&sel.id===id)||(hover&&hover.id===id));
  });
}
function select(u){
  sel=u; paintRows(); draw();
  document.querySelector(`#tb tr[data-id="${u.id}"]`)?.scrollIntoView({block:'nearest'});
}

resize();
apply();
</script>
</body>
</html>
